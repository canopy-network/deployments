# traefik-dynamic.yaml
#
# Subdomain-per-app routing (wallet./explorer./rpc./adminrpc.nodeN.$DOMAIN),
# mirroring local.yaml. The new explorer/wallet UIs request assets from
# root-relative paths, so PathPrefix + stripPrefix routing breaks them.
# Requires the *.node1.$DOMAIN / *.node2.$DOMAIN wildcard A records from the
# README (already part of the documented DNS setup).
#
# Admin API split (newer canopy): /v1/tx & friends are served by the regular
# RPC port (50002/40002); only /v1/admin/* remains on the admin port
# (50003/40003). All adminrpc entry points below route accordingly.
#
# The wallet host serves /rpc and /adminrpc same-origin so the browser reuses
# the wallet's basic-auth credentials (cross-origin preflights would be 401'd
# by the basic-auth middleware). Point config.json at:
#   rpcURL:      https://rpc.nodeN.$DOMAIN
#   adminRPCUrl: https://wallet.nodeN.$DOMAIN/adminrpc
http:
  routers:
    canopy-monitoring:
      rule: Host(`monitoring.{{ env "DOMAIN" }}`)
      service: canopy-monitoring
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    # ---------- node1 ----------
    canopy-node1-wallet:
      rule: Host(`wallet.node1.{{ env "DOMAIN" }}`)
      service: canopy-wallet
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    # Same-origin RPC/admin API for the wallet UI (see header note).
    canopy-node1-wallet-rpc:
      rule: Host(`wallet.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-wallet-adminrpc-admin:
      rule: Host(`wallet.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc
      priority: 3
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-wallet-adminrpc:
      rule: Host(`wallet.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-explorer:
      rule: Host(`explorer.node1.{{ env "DOMAIN" }}`)
      service: canopy-explorer
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    # Same-origin RPC/admin API on the explorer host, so a relative
    # rpcURL/adminRPCUrl ("/rpc", "/adminrpc") in config.json works from
    # both UIs (mirrors the k8s staging IngressRoutes).
    canopy-node1-explorer-rpc:
      rule: Host(`explorer.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-explorer-adminrpc-admin:
      rule: Host(`explorer.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc
      priority: 3
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-explorer-adminrpc:
      rule: Host(`explorer.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-rpc:
      rule: Host(`rpc.node1.{{ env "DOMAIN" }}`)
      service: canopy-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-subdomain-root-to-v1-eth
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc-admin:
      rule: Host(`adminrpc.node1.{{ env "DOMAIN" }}`) && PathPrefix(`/v1/admin`)
      service: canopy-admin-rpc
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc:
      rule: Host(`adminrpc.node1.{{ env "DOMAIN" }}`)
      service: canopy-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-subdomain-root-to-v1-tx
      tls:
        certResolver: https-resolver

    # The wallet is also served at the host root, same-origin with the /rpc
    # and /adminrpc paths below, so legacy absolute rpcURL/adminRPCUrl
    # config.json values keep working (path routers carry higher priorities;
    # this catch-all only sees what they don't match).
    canopy-node1-root:
      rule: Host(`node1.{{ env "DOMAIN" }}`)
      service: canopy-wallet
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    # Legacy /wallet path 301-redirects to the host root (same wallet, kept
    # same-origin); /explorer redirects to its subdomain.
    canopy-node1-wallet-redirect:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/wallet`)
      service: noop@internal
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - wallet-root-redirect
      tls:
        certResolver: https-resolver

    canopy-node1-explorer-redirect:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/explorer`)
      service: noop@internal
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - explorer-subdomain-redirect
      tls:
        certResolver: https-resolver

    # Legacy path-based RPC routes kept for backwards compatibility:
    # deployed node config.json files still point at
    # https://node1.$DOMAIN/rpc and /adminrpc (see README).
    canopy-node1-rpc-path:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc-admin-path:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc
      priority: 20
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc-path:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    # ---------- node2 ----------
    canopy-node2-wallet:
      rule: Host(`wallet.node2.{{ env "DOMAIN" }}`)
      service: canopy-wallet2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node2-wallet-rpc:
      rule: Host(`wallet.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc2
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-wallet-adminrpc-admin:
      rule: Host(`wallet.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc2
      priority: 3
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-wallet-adminrpc:
      rule: Host(`wallet.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc2
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-explorer:
      rule: Host(`explorer.node2.{{ env "DOMAIN" }}`)
      service: canopy-explorer2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    canopy-node2-explorer-rpc:
      rule: Host(`explorer.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc2
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-explorer-adminrpc-admin:
      rule: Host(`explorer.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc2
      priority: 3
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-explorer-adminrpc:
      rule: Host(`explorer.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc2
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-rpc:
      rule: Host(`rpc.node2.{{ env "DOMAIN" }}`)
      service: canopy-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-subdomain-root-to-v1-eth
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc-admin:
      rule: Host(`adminrpc.node2.{{ env "DOMAIN" }}`) && PathPrefix(`/v1/admin`)
      service: canopy-admin-rpc2
      priority: 2
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc:
      rule: Host(`adminrpc.node2.{{ env "DOMAIN" }}`)
      service: canopy-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-subdomain-root-to-v1-tx
      tls:
        certResolver: https-resolver

    canopy-node2-root:
      rule: Host(`node2.{{ env "DOMAIN" }}`)
      service: canopy-wallet2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node2-wallet-redirect:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/wallet`)
      service: noop@internal
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - wallet-root-redirect
      tls:
        certResolver: https-resolver

    canopy-node2-explorer-redirect:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/explorer`)
      service: noop@internal
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - explorer-subdomain-redirect
      tls:
        certResolver: https-resolver

    canopy-node2-rpc-path:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc2
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - rpc-root-to-v1-eth
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc-admin-path:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc/v1/admin`)
      service: canopy-admin-rpc2
      priority: 20
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc-path:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-rpc2
      priority: 10
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - adminrpc-root-to-v1-tx
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

  services:
    canopy-wallet:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node1:50000/

    canopy-explorer:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node1:50001

    canopy-rpc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node1:50002/

    canopy-admin-rpc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node1:50003/

    canopy-wallet2:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node2:40000

    canopy-explorer2:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node2:40001

    canopy-rpc2:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node2:40002/

    canopy-admin-rpc2:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node2:40003/

    canopy-monitoring:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://grafana:3000/
