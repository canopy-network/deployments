# traefik-dynamic.yaml
#
# Subdomain-per-app routing (wallet./explorer./rpc./adminrpc.nodeN.$DOMAIN),
# mirroring local.yaml. The new explorer/wallet UIs request assets from
# root-relative paths, so PathPrefix + stripPrefix routing breaks them.
# Requires the *.node1.$DOMAIN / *.node2.$DOMAIN wildcard A records from the
# README (already part of the documented DNS setup).
http:
  routers:
    canopy-monitoring:
      rule: Host(`monitoring.{{ env "DOMAIN" }}`)
      service: canopy-monitoring
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    # ---------- node1 ----------
    canopy-node1-wallet:
      rule: Host(`wallet.node1.{{ env "DOMAIN" }}`)
      service: canopy-wallet
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node1-explorer:
      rule: Host(`explorer.node1.{{ env "DOMAIN" }}`)
      service: canopy-explorer
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    canopy-node1-rpc:
      rule: Host(`rpc.node1.{{ env "DOMAIN" }}`)
      service: canopy-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc:
      rule: Host(`adminrpc.node1.{{ env "DOMAIN" }}`)
      service: canopy-admin-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    # Legacy path-based RPC routes kept for backwards compatibility:
    # deployed node config.json files still point at
    # https://node1.$DOMAIN/rpc and /adminrpc (see README).
    canopy-node1-rpc-path:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node1-admin-rpc-path:
      rule: Host(`node1.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-admin-rpc
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

    # ---------- node2 ----------
    canopy-node2-wallet:
      rule: Host(`wallet.node2.{{ env "DOMAIN" }}`)
      service: canopy-wallet2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node2-explorer:
      rule: Host(`explorer.node2.{{ env "DOMAIN" }}`)
      service: canopy-explorer2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    canopy-node2-rpc:
      rule: Host(`rpc.node2.{{ env "DOMAIN" }}`)
      service: canopy-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc:
      rule: Host(`adminrpc.node2.{{ env "DOMAIN" }}`)
      service: canopy-admin-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
      tls:
        certResolver: https-resolver

    canopy-node2-rpc-path:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/rpc`)
      service: canopy-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - strip-rpc-prefix
      tls:
        certResolver: https-resolver

    canopy-node2-admin-rpc-path:
      rule: Host(`node2.{{ env "DOMAIN" }}`) && PathPrefix(`/adminrpc`)
      service: canopy-admin-rpc2
      priority: 1
      entryPoints:
        - web
        - websecure
      middlewares:
        - https-redirect
        - basic-auth
        - strip-adminrpc-prefix
      tls:
        certResolver: https-resolver

  services:
    canopy-wallet:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node1:50000/

    canopy-explorer:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node1:50001

    canopy-rpc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node1:50002/

    canopy-admin-rpc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node1:50003/

    canopy-wallet2:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node2:40000

    canopy-explorer2:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://node2:40001

    canopy-rpc2:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node2:40002/

    canopy-admin-rpc2:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://node2:40003/

    canopy-monitoring:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://grafana:3000/
