http:
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
        port: "443"

    wallet-prefix:
      addPrefix:
        prefix: "/wallet"

    explorer-prefix:
      addPrefix:
        prefix: "/explorer"

    remove-referrer-policy:
      headers:
        referrerPolicy: ""  # Empty string to remove the default policy
        customResponseHeaders:
          Referrer-Policy: ""  # This explicitly removes the header

    basic-auth:
      basicAuth:
        users:
          - "canopy:$apr1$GnHnOP0b$zWcOv5kosOuUAuvrlu72C0"

    strip-wallet-prefix:
      stripPrefix:
        prefixes:
          - "/wallet"

    strip-explorer-prefix:
      stripPrefix:
        prefixes:
          - "/explorer"

    strip-rpc-prefix:
      stripPrefix:
        prefixes:
          - "/rpc"

    strip-adminrpc-prefix:
      stripPrefix:
        prefixes:
          - "/adminrpc"

   # Redirect /wallet to /wallet/
    wallet-redirect:
      redirectRegex:
        regex: "^(.*)/wallet$"
        replacement: "${1}/wallet/"
        permanent: true

    # Redirect /explorer to /explorer/
    explorer-redirect:
      redirectRegex:
        regex: "^(.*)/explorer$"
        replacement: "${1}/explorer/"
        permanent: true

    # Redirect legacy path URLs to the per-app subdomains
    # (nodeN.<domain>/wallet -> wallet.nodeN.<domain>). The host captures
    # keep any :port suffix, so this works on nonstandard ports too.
    wallet-subdomain-redirect:
      redirectRegex:
        regex: "^https?://([^./]+)\\.([^/]+)/wallet/?(.*)"
        replacement: "https://wallet.${1}.${2}/${3}"
        permanent: true

    explorer-subdomain-redirect:
      redirectRegex:
        regex: "^https?://([^./]+)\\.([^/]+)/explorer/?(.*)"
        replacement: "https://explorer.${1}.${2}/${3}"
        permanent: true

    # Newer canopy nodes split the admin API: /v1/tx & friends moved to the
    # regular RPC port; only /v1/admin/* remains on the admin port. These
    # rewrites send bare-root POSTs to the right endpoints.
    adminrpc-root-to-v1-tx:
      replacePathRegex:
        regex: "^/adminrpc/?$"
        replacement: /v1/tx

    adminrpc-subdomain-root-to-v1-tx:
      replacePathRegex:
        regex: "^/$"
        replacement: /v1/tx

    rpc-root-to-v1-eth:
      replacePathRegex:
        regex: "^/rpc/?$"
        replacement: /v1/eth

    rpc-subdomain-root-to-v1-eth:
      replacePathRegex:
        regex: "^/$"
        replacement: /v1/eth

    websocket-headers:
      headers:
        customRequestHeaders:
          Connection: "Upgrade"
          Upgrade: "websocket"
        customResponseHeaders:
          Access-Control-Allow-Origin: "*"
