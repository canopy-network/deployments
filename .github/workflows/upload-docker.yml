name: Build & Push Docker Image from Dispatch

on:
  repository_dispatch:
    types: [docker-release]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log payload
        run: echo "Received tag:\ ${{ github.event.client_payload.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare tags
        id: prep
        run: |
          TAG=${{ github.event.client_payload.tag }}
          DOCKER_TAG=${TAG//+/-}
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker_image/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            canopynetwork/canopy:${{ steps.prep.outputs.docker_tag }}
            canopynetwork/canopy:latest
          build-args: |
            BRANCH=${{ github.event.client_payload.tag }}
            BUILD_PATH=cmd/cli
